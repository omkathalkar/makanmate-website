<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Listings — MakanMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1F8A5B; --green-dark:#166644; --green-light:#EBF5F0; --green-mid:#C0DDD0;
    --orange:#C45E1A; --orange-dark:#A84D14; --orange-light:#FBF1E8; --orange-mid:#F0C9A0;
    --wine:#7C1D35; --wine-light:#F5E8EB;
    --slate:#1C1611; --slate-mid:#4A3F35; --slate-soft:#7A6E65;
    --border:#DDD4C8; --bg:#F7F3EE; --white:#FFFDF9;
    --sans:'Manrope',sans-serif; --serif:'Newsreader',serif;
  }
  [data-theme="dark"]{
    --bg:#110D09; --white:#1A1410; --slate:#F0EBE4; --slate-mid:#D4C8BC; --slate-soft:#9C8E84;
    --border:#2D2420; --nav-bg:rgba(17,13,9,0.97); --green-light:#091A10; --green-mid:#0F2A1C; --orange-light:#1F1208; --wine-light:#1F0A10;
  }
  [data-theme="dark"] footer{background:#0A0705;}
  *{box-sizing:border-box;} html{scroll-behavior:smooth;}
  body{margin:0; font-family:var(--sans); color:var(--slate-mid); background:var(--bg); line-height:1.6;}
  img{max-width:100%; display:block;} a{color:inherit; text-decoration:none;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 28px;}

  /* NAV */
  .nav{position:sticky; top:0; z-index:50; background:var(--nav-bg,rgba(255,255,255,0.96)); backdrop-filter:blur(8px); border-bottom:1px solid var(--border);}
  .nav-row{display:flex; align-items:center; justify-content:space-between; padding:14px 28px; max-width:1120px; margin:0 auto;}
  .logo{font-family:var(--sans); font-weight:800; font-size:20px; letter-spacing:-0.3px; color:var(--slate); display:flex; align-items:center; gap:9px;}
  .logo-icon{width:32px; height:32px; background:var(--green); border-radius:8px; display:flex; align-items:center; justify-content:center;}
  .nav-links{display:flex; gap:28px; list-style:none; margin:0; padding:0;}
  .nav-links a{font-weight:600; font-size:14.5px; color:var(--slate-soft); transition:color .15s;}
  .nav-links a:hover,.nav-links a.active{color:var(--green);}
  .nav-cta{background:var(--green); color:#fff; padding:9px 18px; border-radius:7px; font-weight:700; font-size:14px;}
  .nav-owner-link{font-weight:700; font-size:14px; color:var(--orange); margin-right:14px;}
  .theme-toggle{background:none; border:none; cursor:pointer; padding:6px; color:var(--slate-soft); display:flex; align-items:center;}
  .theme-toggle svg{width:18px; height:18px;}
  .nav-toggle{display:none; background:none; border:none; cursor:pointer; padding:4px;}
  .nav-toggle span{display:block; width:24px; height:2px; background:var(--slate); margin:5px 0;}
  @media(max-width:820px){
    .nav-links{position:absolute; top:100%; left:0; right:0; background:var(--white); flex-direction:column; gap:0; border-bottom:1px solid var(--border); max-height:0; overflow:hidden; transition:max-height .25s;}
    .nav-links.open{max-height:320px;}
    .nav-links li{border-top:1px solid var(--border);}
    .nav-links a{display:block; padding:15px 28px;}
    .nav-toggle{display:block;} .nav-cta{display:none;}
  }

  /* EXPLORE HEADER */
  .explore-head{padding:36px 0 0; background:var(--white); border-bottom:1px solid var(--border);}
  .explore-head-inner{max-width:1120px; margin:0 auto; padding:0 28px;}
  .explore-head h1{font-family:var(--serif); font-size:28px; font-weight:500; color:var(--slate); margin:0 0 4px;}
  .explore-head p{font-size:14.5px; color:var(--slate-soft); margin:0 0 20px;}

  /* FILTER BAR */
  .filter-bar{background:var(--white); position:sticky; top:61px; z-index:40; border-bottom:1px solid var(--border); padding:12px 0;}
  .filter-row{max-width:1120px; margin:0 auto; padding:0 28px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .chip-group{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{background:var(--bg); border:1.5px solid var(--border); border-radius:999px; padding:6px 14px; font-family:var(--sans); font-size:13px; font-weight:700; color:var(--slate-soft); cursor:pointer; transition:all .15s; white-space:nowrap;}
  .chip.active{background:var(--green); border-color:var(--green); color:#fff;}
  .chip:hover:not(.active){border-color:var(--green); color:var(--green);}
  .filter-divider{width:1px; height:28px; background:var(--border); flex-shrink:0;}
  .sort-select{background:var(--bg); border:1.5px solid var(--border); border-radius:8px; padding:7px 12px; font-family:var(--sans); font-size:13px; font-weight:600; color:var(--slate-mid); cursor:pointer;}
  .result-count{font-size:13.5px; color:var(--slate-soft); font-weight:600; margin-left:auto; white-space:nowrap;}

  /* LISTING GRID */
  .listings-wrap{padding:28px 0 60px;}
  .listing-grid{max-width:1120px; margin:0 auto; padding:0 28px; display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
  @media(max-width:900px){.listing-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:580px){.listing-grid{grid-template-columns:1fr; padding:0 16px;}}

  /* LISTING CARD */
  .listing-card{background:var(--white); border:1px solid var(--border); border-radius:16px; overflow:hidden; cursor:pointer; transition:box-shadow .18s, transform .18s; display:flex; flex-direction:column;}
  .listing-card:hover{box-shadow:0 8px 28px rgba(15,23,42,.1); transform:translateY(-2px);}
  .card-photo{position:relative; height:196px; background:linear-gradient(135deg,var(--green-mid),var(--green-light));}
  .card-photo img{width:100%; height:100%; object-fit:cover;}
  .card-photo-placeholder{width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--green-dark);}
  .card-photo-placeholder svg{width:40px; height:40px; opacity:.4;}
  .card-photo-placeholder span{font-size:12.5px; font-weight:600; opacity:.6;}
  .card-badges{position:absolute; top:10px; left:10px; display:flex; gap:6px;}
  .badge{padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.2px;}
  .badge-verified{background:var(--green); color:#fff;}
  .badge-tour{background:rgba(15,23,42,.72); color:#fff; backdrop-filter:blur(4px);}
  .card-match{position:absolute; top:10px; right:10px; background:rgba(255,255,255,.92); backdrop-filter:blur(4px); border-radius:999px; padding:3px 9px; font-size:11.5px; font-weight:800; color:var(--green-dark);}
  .card-save{position:absolute; bottom:10px; right:10px; background:rgba(255,255,255,.92); border:none; border-radius:999px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .15s;}
  .card-save:hover{background:#fff;}
  .card-save svg{width:16px; height:16px; stroke:var(--slate-soft); fill:none; transition:all .15s;}
  .card-save.saved svg{stroke:#ef4444; fill:#ef4444;}
  .card-body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-type{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--green-dark); margin:0;}
  .card-title{font-size:16px; font-weight:700; color:var(--slate); margin:0; line-height:1.3;}
  .card-area{font-size:13.5px; color:var(--slate-soft); margin:0;}
  .card-price{display:flex; align-items:baseline; gap:4px; margin:4px 0 0;}
  .card-rent{font-size:20px; font-weight:800; color:var(--slate); font-family:var(--sans);}
  .card-rent-unit{font-size:12.5px; color:var(--slate-soft); font-weight:600;}
  .card-meta{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--slate-soft); margin:4px 0 0;}
  .card-meta span{display:flex; align-items:center; gap:3px;}
  .meta-dot{width:4px; height:4px; border-radius:50%; background:var(--green); flex-shrink:0;}
  .card-tags{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 0;}
  .card-tag{background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:2px 8px; font-size:11.5px; font-weight:600; color:var(--slate-soft);}
  .card-cta{display:block; margin-top:auto; padding-top:14px; text-align:center; background:var(--green-light); border:1.5px solid var(--green-mid); border-radius:10px; padding:10px; font-weight:700; font-size:14px; color:var(--green-dark); transition:background .15s;}
  .card-cta:hover{background:var(--green-mid);}

  .no-results{grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--slate-soft);}
  .no-results h3{color:var(--slate); font-size:18px; margin:0 0 8px;}

  /* FOOTER */
  footer{background:var(--white); border-top:1px solid var(--border); padding:32px 0;}
  .footer-inner{max-width:1120px; margin:0 auto; padding:0 28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; font-size:13.5px; color:var(--slate-soft);}
  .footer-logo-sm{font-weight:800; font-size:16px; color:var(--slate);}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-row">
    <a href="index.html" class="logo">
      <span class="logo-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 11L12 4L21 11V21H15V15H9V21H3V11Z" fill="white"/></svg></span>
      MakanMate
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="explore.html" class="active">Browse listings</a></li>
      <li><a href="index.html#different">Why MakanMate</a></li>
      <li><a href="index.html#owners">For owners</a></li>
      <li><a href="pune.html">Pune guide</a></li>
      <li><a href="index.html#faq">FAQ</a></li>
    </ul>
    <a href="owner.html" class="nav-owner-link">List Property Free</a>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    </button>
    <a href="index.html#waitlist" class="nav-cta">Join waitlist</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="explore-head">
  <div class="explore-head-inner">
    <h1>Find your place in Pune</h1>
    <p id="resultLine">7 verified listings · no contact fees · browse free</p>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-row">
    <div class="chip-group" id="typeChips">
      <button class="chip active" data-type="all">All types</button>
      <button class="chip" data-type="pg">PG</button>
      <button class="chip" data-type="flatmates">Shared flat</button>
      <button class="chip" data-type="flat">Whole flat</button>
      <button class="chip" data-type="studio">Studio</button>
    </div>
    <div class="filter-divider"></div>
    <div class="chip-group" id="budgetChips">
      <button class="chip active" data-budget="all">Any budget</button>
      <button class="chip" data-budget="5k">Under ₹5k</button>
      <button class="chip" data-budget="5-8k">₹5–8k</button>
      <button class="chip" data-budget="8-12k">₹8–12k</button>
      <button class="chip" data-budget="12k+">₹12k+</button>
    </div>
    <div class="filter-divider"></div>
    <select class="sort-select" id="sortSelect">
      <option value="match">Best match</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="safety">Safety score</option>
    </select>
    <span class="result-count" id="resultCount">7 listings</span>
  </div>
</div>

<div class="listings-wrap">
  <div class="listing-grid" id="listingGrid"></div>
</div>

<footer>
  <div class="footer-inner">
    <span class="footer-logo-sm">MakanMate</span>
    <span>Verified PGs in Pune. Zero brokerage.</span>
    <a href="mailto:contact@makanmate.in" style="color:var(--green); font-weight:700;">contact@makanmate.in</a>
  </div>
</footer>

<script src="data.js"></script>
<script>
  // Theme
  (function(){
    const saved = localStorage.getItem('mm-theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  })();
  document.getElementById('themeToggle').addEventListener('click', function(){
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('mm-theme', next);
  });
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => navLinks.classList.toggle('open'));

  // Saved state
  const saved = JSON.parse(localStorage.getItem('mm-saved') || '[]');
  function toggleSave(id, btn) {
    const idx = saved.indexOf(id);
    if (idx === -1) { saved.push(id); btn.classList.add('saved'); }
    else { saved.splice(idx,1); btn.classList.remove('saved'); }
    localStorage.setItem('mm-saved', JSON.stringify(saved));
  }

  // Filter state
  let activeType = 'all';
  let activeBudget = 'all';
  let activeSort = 'match';

  function budgetMatch(rent, key) {
    if (key === 'all') return true;
    if (key === '5k') return rent < 5000;
    if (key === '5-8k') return rent >= 5000 && rent <= 8000;
    if (key === '8-12k') return rent > 8000 && rent <= 12000;
    if (key === '12k+') return rent > 12000;
    return true;
  }

  function getFiltered() {
    let list = MM.listings.filter(l => {
      if (activeType !== 'all' && l.type !== activeType) return false;
      if (!budgetMatch(l.rent, activeBudget)) return false;
      return true;
    });
    if (activeSort === 'price-asc') list.sort((a,b) => a.rent - b.rent);
    else if (activeSort === 'price-desc') list.sort((a,b) => b.rent - a.rent);
    else if (activeSort === 'safety') list.sort((a,b) => b.safety - a.safety);
    else list.sort((a,b) => b.match - a.match);
    return list;
  }

  function starHTML(r) {
    return '★'.repeat(Math.round(r)) + '☆'.repeat(5 - Math.round(r));
  }

  function cardHTML(l) {
    const isSaved = saved.includes(l.id);
    const cover = MM.coverPhoto(l);
    const photoEl = cover
      ? `<img src="${cover}" alt="${l.title}" loading="lazy">`
      : `<div class="card-photo-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Photos coming soon</span></div>`;

    return `<article class="listing-card" onclick="location.href='listing.html?id=${l.id}'">
      <div class="card-photo">
        ${photoEl}
        <div class="card-badges">
          <span class="badge badge-verified">Verified</span>
          ${l.hasTour ? '<span class="badge badge-tour">360° tour</span>' : ''}
        </div>
        <div class="card-match">${l.match}% match</div>
        <button class="card-save ${isSaved?'saved':''}" onclick="event.stopPropagation();toggleSave('${l.id}',this)" title="Save listing">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>
      <div class="card-body">
        <p class="card-type">${l.typeLabel}</p>
        <h3 class="card-title">${l.title}</h3>
        <p class="card-area">${l.area}</p>
        <div class="card-price">
          <span class="card-rent">${MM.fmt(l.rent)}</span>
          <span class="card-rent-unit">${l.rentUnit}</span>
        </div>
        <div class="card-meta">
          <span><span class="meta-dot"></span>Safety ${l.safety}</span>
          <span><span class="meta-dot"></span>Bus ${l.busMin} min</span>
          <span><span class="meta-dot"></span>${l.rating} stars (${l.reviewCount})</span>
        </div>
        <div class="card-tags">${l.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>
        <a href="listing.html?id=${l.id}" class="card-cta">View details</a>
      </div>
    </article>`;
  }

  function render() {
    const list = getFiltered();
    const grid = document.getElementById('listingGrid');
    const count = document.getElementById('resultCount');
    const line = document.getElementById('resultLine');
    if (list.length === 0) {
      grid.innerHTML = `<div class="no-results"><h3>No listings match these filters</h3><p>Try a different budget or type.</p></div>`;
    } else {
      grid.innerHTML = list.map(cardHTML).join('');
    }
    count.textContent = list.length + ' listing' + (list.length !== 1 ? 's' : '');
    line.textContent = list.length + ' verified listing' + (list.length !== 1 ? 's' : '') + ' · no contact fees · browse free';
  }

  // Chip event listeners
  document.getElementById('typeChips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#typeChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeType = chip.dataset.type;
    render();
  });
  document.getElementById('budgetChips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#budgetChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeBudget = chip.dataset.budget;
    render();
  });
  document.getElementById('sortSelect').addEventListener('change', e => {
    activeSort = e.target.value;
    render();
  });

  render();
</script>
</body>
</html>
